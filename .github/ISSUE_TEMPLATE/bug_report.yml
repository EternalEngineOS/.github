name: Bug report
description: Something in the EternalEngine product or docs is broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository doesn't hold the product source (it's private), but we track
        product bugs here so they aren't lost. If this is a security vulnerability,
        stop — use [`SECURITY.md`](../../SECURITY.md) instead of a public issue.
  - type: input
    id: area
    attributes:
      label: Which app or page?
      placeholder: e.g. ClientForge, PayGate checkout, eternalengineos.io/pricing
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / device (if relevant)
  - type: markdown
    attributes:
      value: |
        For urgent production issues affecting your account, email
        [info@eternalengineos.io](mailto:info@eternalengineos.io) — it'll get to us
        faster than a GitHub issue.
